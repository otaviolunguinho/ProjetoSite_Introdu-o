<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
  <title id="t">Pé na Trilha</title>
  <desc id="d">Ilustração de uma trilha na natureza com uma pessoa em cadeira de rodas para trilha, acompanhada de um amigo, e uma pessoa com bengala branca caminhando.</desc>

  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ec"/>
      <stop offset="0.6" stop-color="#d9efe6"/>
      <stop offset="1" stop-color="#fdf0d0"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>

    <!-- pinheiro -->
    <g id="pinheiro">
      <rect x="-5" y="-20" width="10" height="24" fill="#6b4a2f"/>
      <polygon points="0,-135 -38,-70 38,-70" fill="#2f6b3a"/>
      <polygon points="0,-110 -48,-40 48,-40" fill="#357a42"/>
      <polygon points="0,-80 -58,-8 58,-8" fill="#2a6034"/>
    </g>
    <!-- árvore redonda -->
    <g id="arvore">
      <path d="M-6 6 L-4 -60 L4 -60 L6 6Z" fill="#6b4a2f"/>
      <circle cx="0" cy="-90" r="42" fill="#3f8a4c"/>
      <circle cx="-30" cy="-68" r="28" fill="#4a9a56"/>
      <circle cx="30" cy="-70" r="28" fill="#378044"/>
    </g>
    <!-- nuvem -->
    <g id="nuvem">
      <ellipse cx="0" cy="0" rx="60" ry="20" fill="#fff" opacity="0.9"/>
      <ellipse cx="-25" cy="-14" rx="30" ry="22" fill="#fff" opacity="0.9"/>
      <ellipse cx="22" cy="-18" rx="34" ry="26" fill="#fff" opacity="0.9"/>
    </g>
    <!-- flor -->
    <g id="flor">
      <line x1="0" y1="0" x2="0" y2="-16" stroke="#3f8a4c" stroke-width="3"/>
      <circle cx="0" cy="-20" r="6" fill="#f2a93b"/>
      <circle cx="0" cy="-20" r="2.5" fill="#c8553d"/>
    </g>
  </defs>

  <!-- céu e sol -->
  <rect width="1200" height="800" fill="url(#ceu)"/>
  <circle cx="980" cy="160" r="150" fill="url(#brilho)"/>
  <circle cx="980" cy="160" r="62" fill="#f7b538"/>
  <use href="#nuvem" x="230" y="130"/>
  <use href="#nuvem" x="620" y="85" transform="translate(620 85) scale(0.8) translate(-620 -85)"/>
  <use href="#nuvem" x="1090" y="290" transform="translate(1090 290) scale(0.7) translate(-1090 -290)"/>

  <!-- pássaros -->
  <g fill="none" stroke="#3b4a45" stroke-width="3" stroke-linecap="round">
    <path d="M430 210 q12 -14 24 0 q12 -14 24 0"/>
    <path d="M520 165 q9 -10 18 0 q9 -10 18 0"/>
    <path d="M820 250 q10 -12 20 0 q10 -12 20 0"/>
  </g>

  <!-- montanhas distantes -->
  <path d="M0 470 L170 300 L290 400 L470 240 L650 410 L790 330 L980 440 L1120 310 L1200 370 V600 H0Z" fill="#a9c4b0"/>
  <path d="M470 240 L430 285 L470 275 L505 292 L520 270Z" fill="#eef5ee" opacity="0.9"/>
  <path d="M170 300 L145 330 L172 322 L196 338Z" fill="#eef5ee" opacity="0.9"/>

  <!-- colinas -->
  <path d="M0 580 Q200 460 430 545 T820 520 T1200 500 V800 H0Z" fill="#7aa885"/>
  <path d="M0 640 Q260 540 560 620 T1200 580 V800 H0Z" fill="#5f9a6a"/>

  <!-- árvores ao fundo -->
  <use href="#pinheiro" transform="translate(120 600) scale(0.9)"/>
  <use href="#pinheiro" transform="translate(210 615) scale(0.7)"/>
  <use href="#arvore" transform="translate(1000 590) scale(0.8)"/>
  <use href="#pinheiro" transform="translate(1090 600) scale(1)"/>
  <use href="#pinheiro" transform="translate(900 580) scale(0.6)"/>

  <!-- chão -->
  <path d="M0 700 Q300 630 620 690 T1200 650 V800 H0Z" fill="#4f8a5b"/>

  <!-- trilha sinuosa -->
  <path d="M400 800 C450 735 770 725 700 655 C655 605 600 592 690 548 L722 548 C650 592 722 612 790 662 C890 735 700 765 790 800Z"
        fill="#ecd6a6" stroke="#d6b878" stroke-width="4" stroke-linejoin="round"/>
  <!-- pedrinhas -->
  <g fill="#cdb27c">
    <ellipse cx="560" cy="790" rx="9" ry="4"/>
    <ellipse cx="660" cy="742" rx="7" ry="3"/>
    <ellipse cx="740" cy="700" rx="6" ry="3"/>
    <ellipse cx="690" cy="620" rx="4" ry="2"/>
  </g>

  <!-- corrimão-guia ao longo da trilha -->
  <g stroke="#7a5230" stroke-width="5" stroke-linecap="round">
    <line x1="905" y1="690" x2="905" y2="725"/>
    <line x1="845" y1="665" x2="845" y2="692"/>
    <line x1="790" y1="640" x2="790" y2="662"/>
  </g>
  <path d="M905 696 Q875 678 845 671 Q818 660 790 645" fill="none" stroke="#c8553d" stroke-width="4"/>

  <!-- árvores e flores em primeiro plano -->
  <use href="#arvore" transform="translate(110 700) scale(1.4)"/>
  <use href="#pinheiro" transform="translate(1110 760) scale(1.5)"/>
  <use href="#arvore" transform="translate(1000 690) scale(0.9)"/>
  <use href="#flor" x="340" y="770"/><use href="#flor" x="372" y="785"/><use href="#flor" x="300" y="760"/>
  <use href="#flor" x="850" y="780"/><use href="#flor" x="880" y="770"/><use href="#flor" x="935" y="790"/>

  <!-- placa -->
  <rect x="250" y="620" width="12" height="130" rx="3" fill="#7a5230"/>
  <rect x="180" y="565" width="152" height="68" rx="10" fill="#1f4a5c" stroke="#f4e9d0" stroke-width="4"/>
  <text x="256" y="595" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#f4e9d0">TRILHA</text>
  <text x="256" y="620" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#f2a93b">ACESSÍVEL</text>

  <!-- ===== PESSOA EM CADEIRA DE TRILHA + AMIGO ===== -->
  <g transform="translate(520 775)">
    <!-- sombra -->
    <ellipse cx="10" cy="2" rx="105" ry="9" fill="#000" opacity="0.15"/>

    <!-- amigo (atrás, empurrando) -->
    <rect x="-84" y="-64" width="9" height="64" rx="3" fill="#2d3a4a"/>
    <rect x="-70" y="-64" width="9" height="64" rx="3" fill="#2d3a4a" transform="rotate(-6 -66 -64)"/>
    <rect x="-90" y="-124" width="30" height="64" rx="10" fill="#e07a3f"/>
    <circle cx="-73" cy="-140" r="14" fill="#8d5a3b"/>
    <path d="M-87 -144 Q-73 -162 -59 -144 Q-66 -150 -73 -150 Q-82 -150 -87 -144Z" fill="#2a1d14"/>
    <line x1="-64" y1="-108" x2="-30" y2="-100" stroke="#8d5a3b" stroke-width="8" stroke-linecap="round"/>
    <!-- mochila -->
    <rect x="-104" y="-118" width="16" height="38" rx="6" fill="#2e9c8a"/>

    <!-- cadeira: roda grande -->
    <circle cx="12" cy="-40" r="40" fill="none" stroke="#2b2b2b" stroke-width="8"/>
    <circle cx="12" cy="-40" r="5" fill="#2b2b2b"/>
    <g stroke="#555" stroke-width="2">
      <line x1="12" y1="-76" x2="12" y2="-4"/>
      <line x1="-24" y1="-40" x2="48" y2="-40"/>
      <line x1="-13" y1="-65" x2="37" y2="-15"/>
      <line x1="37" y1="-65" x2="-13" y2="-15"/>
    </g>
    <!-- cadeira: estrutura -->
    <path d="M-14 -66 L-22 -112 L-34 -112" fill="none" stroke="#1f6f8b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-14 -66 L52 -66 L66 -30 L84 -30" fill="none" stroke="#1f6f8b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- roda pequena frontal -->
    <circle cx="80" cy="-14" r="14" fill="none" stroke="#2b2b2b" stroke-width="6"/>
    <line x1="68" y1="-66" x2="80" y2="-28" stroke="#1f6f8b" stroke-width="5"/>

    <!-- pessoa sentada -->
    <path d="M0 -74 L50 -74 L66 -36" fill="none" stroke="#3b5ea8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="76" cy="-30" rx="15" ry="7" fill="#c8553d"/>
    <rect x="-10" y="-136" width="30" height="64" rx="11" fill="#f2c14e"/>
    <circle cx="6" cy="-152" r="14" fill="#c68a62"/>
    <path d="M-8 -156 Q6 -176 20 -156 Q12 -162 6 -162 Q-2 -162 -8 -156Z" fill="#3a2a1c"/>
    <!-- chapéu de aba -->
    <ellipse cx="6" cy="-163" rx="27" ry="6" fill="#d9b779"/>
    <path d="M-8 -164 Q6 -184 20 -164Z" fill="#d9b779"/>
    <!-- sorriso -->
    <path d="M1 -148 Q7 -143 13 -148" fill="none" stroke="#5a2f1c" stroke-width="2" stroke-linecap="round"/>
    <!-- braço -->
    <line x1="8" y1="-118" x2="40" y2="-98" stroke="#c68a62" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- ===== PESSOA COM BENGALA BRANCA ===== -->
  <g transform="translate(760 792)">
    <ellipse cx="0" cy="2" rx="40" ry="6" fill="#000" opacity="0.15"/>
    <line x1="-8" y1="-64" x2="-20" y2="0" stroke="#2d3a4a" stroke-width="11" stroke-linecap="round"/>
    <line x1="8" y1="-64" x2="18" y2="0" stroke="#2d3a4a" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="-24" cy="2" rx="11" ry="5" fill="#222"/>
    <ellipse cx="23" cy="2" rx="11" ry="5" fill="#222"/>
    <rect x="-18" y="-130" width="36" height="72" rx="12" fill="#8a4fb0"/>
    <circle cx="0" cy="-148" r="15" fill="#a9694a"/>
    <path d="M-15 -152 Q0 -174 15 -152 Q8 -158 0 -158 Q-9 -158 -15 -152Z" fill="#1f1a14"/>
    <rect x="-3" y="-152" width="18" height="6" rx="3" fill="#1c1c1c"/>
    <!-- braço com bengala -->
    <line x1="14" y1="-112" x2="52" y2="-84" stroke="#a9694a" stroke-width="9" stroke-linecap="round"/>
    <line x1="52" y1="-84" x2="104" y2="-2" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="80" y1="-42" x2="92" y2="-23" stroke="#c8553d" stroke-width="5"/>
    <line x1="-16" y1="-108" x2="-30" y2="-76" stroke="#a9694a" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- selo do título -->
  <g transform="translate(60 56)">
    <rect width="420" height="118" rx="22" fill="#1f4a28" opacity="0.94"/>
    <text x="30" y="62" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#f4e9d0">Pé na Trilha</text>
    <text x="32" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#f2a93b">A natureza é de todos</text>
  </g>
</svg>
